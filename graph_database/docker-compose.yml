services:
  kafka:
    image: confluentinc/confluent-local:7.5.0
    container_name: kafka
    ports:
      - "19092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:19092
    networks:
      - major_project_network

networks:
  major_project_network:
    external: true